<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scan & Go - Fix Auteur Définitif</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #f4f7f6; --card-bg: #ffffff; --text: #333; --border: #ddd; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 0 0 10px 10px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.2rem; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        label { font-weight: 600; font-size: 0.85rem; color: #7f8c8d; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 15px; margin: 5px 0 15px; border: 2px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 16px; background: #fafafa; }
        input:focus { border-color: var(--primary); outline: none; }
        .isbn-section input { font-family: monospace; font-size: 1.2rem; letter-spacing: 1px; border-color: var(--primary); background: #eef2f5; }
        
        .btn-add { background-color: var(--accent); color: white; border: none; padding: 18px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; width: 100%; box-shadow: 0 4px 0 #219150; margin-top: 10px; }
        .btn-add:active { transform: translateY(4px); box-shadow: none; }
        .btn-add:disabled { background-color: #ccc; box-shadow: none; }
        
        .status-msg { text-align: center; font-weight: bold; min-height: 24px; margin: 10px 0; font-size: 0.9rem; }
        .success { color: var(--accent); }
        .error { color: #e74c3c; }
        .warning { color: #f39c12; }
        
        #debug-info { font-size: 0.75rem; color: #999; background: #f9f9f9; padding: 10px; border-radius: 4px; margin-top: 10px; display: none; word-break: break-all; }
        
        #list { list-style: none; padding: 0; }
        .item-card { background: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--primary); }
        .delete-btn { background: #ffebee; color: #e74c3c; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; }
        #auth-container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; text-align: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="auth-container">
    <h2>Connexion</h2>
    <input type="email" id="auth-email" placeholder="Email">
    <input type="password" id="auth-password" placeholder="Mot de passe">
    <button class="btn-add" onclick="App.doLogin()">Entrer</button>
    <div id="login-msg" class="status-msg error"></div>
</div>

<div id="app-content" style="display:none;">
    <header>
        <h1>📚 Scan & Go (Fix Auteur)</h1>
        <div style="font-size:0.8rem; opacity:0.8;">Nettoyage automatique des objets auteurs</div>
    </header>

    <div class="container">
        <div class="card">
            <label for="isbn">1. Scannez le code-barres</label>
            <div class="isbn-section">
                <input type="text" id="isbn" placeholder="ISBN (ex: 9782070408504)" autocomplete="off" inputmode="numeric">
            </div>

            <div id="search-status" class="status-msg"></div>
            <div id="debug-info"></div>

            <label for="item-title">2. Titre</label>
            <input type="text" id="item-title" placeholder="Titre du livre">
            
            <div style="display:flex; gap:10px;">
                <div style="flex:2">
                    <label for="item-author">Auteur</label>
                    <input type="text" id="item-author" placeholder="Auteur">
                </div>
                <div style="flex:1">
                    <label for="item-year">Année</label>
                    <input type="number" id="item-year" placeholder="2024">
                </div>
            </div>

            <label for="category">Catégorie</label>
            <select id="category">
                <option value="Livre">📖 Livre</option>
                <option value="JdR">🎲 JdR</option>
                <option value="Jeu de Société">🧩 Jeu de Société</option>
                <option value="Vinyle">💿 Vinyle</option>
                <option value="BD">🎨 BD</option>
            </select>

            <button class="btn-add" id="btn-add" onclick="App.addItemAndNext()">
                ✅ Valider & Suivant
            </button>
        </div>

        <div class="card">
            <h3>Derniers ajouts</h3>
            <ul id="list"></ul>
        </div>
    </div>
</div>

<script>
const App = {
    config: {
        supabaseUrl: 'https://xknjgdtnzxvbzavzksgr.supabase.co',
        supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrbmpnZHRuenh2Ynphdnprc2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MjU1MjIsImV4cCI6MjEwNDUwMTUyMn0.a5fOexL2fXWUmBmQO2k3KfnyNnC313rtmM9xlwo2azA',
        apis: [
            { 
                name: "BnF", 
                url: (isbn) => `https://catalogue.bnf.fr/api/search?isbn=${isbn}&format=json&max=1`,
                parse: (data) => {
                    if (!data.document || data.document.length === 0) return null;
                    const doc = data.document[0];
                    
                    // FONCTION DE NETTOYAGE ROBUSTE
                    const cleanAuthor = (raw) => {
                        if (!raw) return '';
                        if (typeof raw === 'string') return raw;
                        if (Array.isArray(raw)) {
                            return raw.map(item => {
                                if (typeof item === 'string') return item;
                                if (item.name) return item.name;
                                if (item._id) return item._id; // Parfois l'ID est le nom chez BnF
                                return JSON.stringify(item);
                            }).join(', ');
                        }
                        if (typeof raw === 'object') {
                            if (raw.name) return raw.name;
                            if (raw._id) return raw._id;
                            // Si c'est un objet complexe, on essaie de trouver une clé texte
                            for (let key in raw) {
                                if (typeof raw[key] === 'string' && raw[key].length > 2) return raw[key];
                            }
                            return JSON.stringify(raw);
                        }
                        return String(raw);
                    };

                    return {
                        title: doc.title || doc.zoneTitle || 'Titre inconnu',
                        author: cleanAuthor(doc.author) || cleanAuthor(doc.zoneAuthor) || '',
                        year: doc.datePublication ? String(doc.datePublication).substring(0,4) : ''
                    };
                }
            },
            { 
                name: "OpenLibrary", 
                url: (isbn) => `https://openlibrary.org/isbn/${isbn}.json`,
                parse: (data) => {
                    if (!data.title) return null;
                    
                    const cleanAuthor = (raw) => {
                        if (!raw) return '';
                        if (typeof raw === 'string') return raw;
                        if (Array.isArray(raw)) {
                            return raw.map(item => {
                                if (typeof item === 'string') return item;
                                if (item.name) return item.name;
                                if (item.key) return item.key; 
                                return JSON.stringify(item);
                            }).join(', ');
                        }
                        return String(raw);
                    };

                    return {
                        title: data.title,
                        author: cleanAuthor(data.authors),
                        year: data.first_publish_date ? String(data.first_publish_date).substring(0,4) : ''
                    };
                }
            }
        ]
    },
    state: { 
        user: null, 
        collection: [],
        localCache: JSON.parse(localStorage.getItem('bookCache') || '{}') 
    },
    supabase: null,
    searchTimeout: null,

    init: function() {
        this.supabase = window.supabase.createClient(this.config.supabaseUrl, this.config.supabaseKey);
        this.checkSession();
        
        const isbnInput = document.getElementById('isbn');
        isbnInput.addEventListener('input', () => {
            clearTimeout(this.searchTimeout);
            const val = isbnInput.value.replace(/[^0-9X]/g, '');
            if (val.length >= 10) {
                this.searchTimeout = setTimeout(() => this.searchISBN(val), 800);
            }
        });
        isbnInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                this.searchISBN(isbnInput.value.replace(/[^0-9X]/g, ''));
            }
        });
    },

    checkSession: async function() {
        const { data } = await this.supabase.auth.getSession();
        if (data.session) {
            this.state.user = data.session.user;
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            this.loadCollection();
            setTimeout(() => document.getElementById('isbn').focus(), 500);
        }
    },

    doLogin: async function() {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-password').value;
        const { error } = await this.supabase.auth.signInWithPassword({ email, password: pass });
        if (error) document.getElementById('login-msg').textContent = "Erreur: " + error.message;
        else window.location.reload();
    },

    loadCollection: async function() {
        if (!this.state.user) return;
        const { data } = await this.supabase.from('collection').select('*').eq('user_id', this.state.user.id).order('dateAdded', { ascending: false }).limit(10);
        this.state.collection = data || [];
        const list = document.getElementById('list');
        list.innerHTML = '';
        this.state.collection.forEach(item => {
            list.innerHTML += `<li class="item-card">
                <div style="flex:1">
                    <strong>${item.title}</strong><br>
                    <small style="color:#7f8c8d">${item.author || ''} • ${item.category}</small>
                </div>
                <button class="delete-btn" onclick="App.deleteItem(${item.id})">✕</button>
            </li>`;
        });
    },

    addItemAndNext: async function() {
        const title = document.getElementById('item-title').value;
        const isbn = document.getElementById('isbn').value.replace(/[^0-9X]/g, '').toUpperCase();
        
        if (!title) {
            alert("Veuillez entrer un titre.");
            document.getElementById('isbn').focus();
            return;
        }

        if (isbn) {
            this.state.localCache[isbn] = {
                title: title,
                author: document.getElementById('item-author').value,
                year: document.getElementById('item-year').value
            };
            localStorage.setItem('bookCache', JSON.stringify(this.state.localCache));
        }

        const btn = document.getElementById('btn-add');
        btn.disabled = true;
        btn.textContent = "Ajout...";

        const newItem = {
            title: title,
            author: document.getElementById('item-author').value,
            year: document.getElementById('item-year').value,
            category: document.getElementById('category').value,
            isbn: isbn,
            dateAdded: new Date().toISOString(),
            user_id: this.state.user.id
        };

        const { error } = await this.supabase.from('collection').insert([newItem]);

        if (error) { 
            alert("Erreur: " + error.message); 
        } else {
            this.resetFormForNextScan();
            this.loadCollection();
        }
        
        btn.disabled = false;
        btn.textContent = "✅ Valider & Suivant";
    },

    resetFormForNextScan: function() {
        document.getElementById('item-title').value = '';
        document.getElementById('item-author').value = '';
        document.getElementById('item-year').value = '';
        document.getElementById('isbn').value = '';
        document.getElementById('search-status').textContent = 'Ajouté ! Prêt pour le suivant.';
        document.getElementById('search-status').className = 'status-msg success';
        document.getElementById('debug-info').style.display = 'none';
        document.getElementById('isbn').focus();
        setTimeout(() => document.getElementById('search-status').textContent = '', 2000);
    },

    deleteItem: async function(id) {
        if(confirm("Supprimer ?")) {
            await this.supabase.from('collection').delete().eq('id', id);
            this.loadCollection();
        }
    },

    searchISBN: async function(isbn) {
        if (!isbn || isbn.length < 10) return;
        
        const status = document.getElementById('search-status');
        const debug = document.getElementById('debug-info');
        debug.style.display = 'block';
        debug.textContent = "Analyse...";

        // 1. Cache local
        if (this.state.localCache[isbn]) {
            const cached = this.state.localCache[isbn];
            document.getElementById('item-title').value = cached.title;
            document.getElementById('item-author').value = cached.author || '';
            document.getElementById('item-year').value = cached.year || '';
            status.textContent = "🟢 Retrouvé dans votre mémoire locale !";
            status.className = "status-msg success";
            debug.textContent = "Source: Cache Local";
            document.getElementById('btn-add').focus();
            return;
        }

        // 2. API
        status.textContent = "Recherche en ligne...";
        status.className = "status-msg warning";

        for (const api of this.config.apis) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const res = await fetch(api.url(isbn), { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (res.status === 429 || res.status === 403) continue;
                if (!res.ok) throw new Error();
                
                const data = await res.json();
                
                // DEBUG: Afficher un extrait de la réponse brute
                debug.textContent = `Source: ${api.name}\nBrut Auteur: ${JSON.stringify(data.document ? data.document[0].author : data.authors)}`;

                const book = api.parse(data);

                if (book && book.title) {
                    document.getElementById('item-title').value = book.title;
                    document.getElementById('item-author').value = book.author;
                    document.getElementById('item-year').value = book.year;
                    
                    this.state.localCache[isbn] = book;
                    localStorage.setItem('bookCache', JSON.stringify(this.state.localCache));
                    
                    status.textContent = `🟢 Trouvé via ${api.name}`;
                    status.className = "status-msg success";
                    debug.textContent += `\nRésultat nettoyé: ${book.author}`;
                    document.getElementById('btn-add').focus();
                    return;
                }
            } catch (e) {
                console.warn(`API ${api.name} échouée`, e);
                continue;
            }
        }
        
        status.textContent = "⚠️ Internet indisponible. Saisie manuelle.";
        status.className = "status-msg error";
        debug.textContent = "Aucune API n'a répondu correctement.";
        document.getElementById('item-title').focus();
    }
};

App.init();
</script>
</body>
</html>
