<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Collection - Multi-Sources</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #f4f7f6; --card-bg: #ffffff; --text: #333; --border: #ddd; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        h1 { text-align: center; color: var(--primary); }
        #auth-container { max-width: 400px; margin: 50px auto; background: var(--card-bg); padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        .status-msg { margin-top: 10px; font-size: 0.9em; min-height: 20px; font-weight: bold; }
        .error-msg { color: #e74c3c; }
        .success-msg { color: #27ae60; }
        .info-msg { color: #2980b9; }
        #app-content { display: none; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button.accent { background-color: var(--accent); }
        button.search-btn { background-color: #3498db; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .source-log { font-size: 0.8em; color: #7f8c8d; margin-top: 5px; font-style: italic; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="auth-container">
    <h2>Connexion</h2>
    <input type="email" id="auth-email" class="auth-input" placeholder="Email">
    <input type="password" id="auth-password" class="auth-input" placeholder="Mot de passe">
    <button class="accent" id="btn-login" onclick="App.doLogin()">Se connecter</button>
    <div id="login-msg" class="status-msg error-msg"></div>
</div>

<div id="app-content">
    <div class="container">
        <h1>📚 Ma Collection (Multi-Sources)</h1>
        
        <div class="card">
            <h3>Recherche de livre</h3>
            <label>ISBN</label>
            <div class="btn-row">
                <input type="text" id="isbn" placeholder="Ex: 9782070408504" style="margin:0;">
                <button class="search-btn" id="btn-search" onclick="App.searchISBN()">🔍 Chercher</button>
            </div>
            <div id="search-msg" class="status-msg"></div>
            <div id="source-log" class="source-log"></div>

            <label>Titre *</label>
            <input type="text" id="item-title">
            <label>Auteur</label>
            <input type="text" id="item-author">
            <label>Année</label>
            <input type="number" id="item-year">
            <label>Catégorie</label>
            <select id="category">
                <option value="Livre">Livre</option>
                <option value="JdR">Jeu de Rôle</option>
                <option value="Vinyle">Vinyle</option>
            </select>

            <button class="accent" onclick="App.addItem()">Ajouter à la collection</button>
        </div>

        <div class="card">
            <h3>Ma Collection</h3>
            <ul id="list" style="list-style:none; padding:0;"></ul>
        </div>
    </div>
</div>

<script>
const App = {
    config: {
        supabaseUrl: 'https://xknjgdtnzxvbzavzksgr.supabase.co',
        supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrbmpnZHRuenh2Ynphdnprc2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MjU1MjIsImV4cCI6MjEwNDUwMTUyMn0.a5fOexL2fXWUmBmQO2k3KfnyNnC313rtmM9xlwo2azA',
        // Sources multiples
        apis: [
            { name: "Google Books", url: (isbn) => `https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}` },
            { name: "OpenLibrary", url: (isbn) => `https://openlibrary.org/isbn/${isbn}.json` },
            { name: "BnF (France)", url: (isbn) => `https://catalogue.bnf.fr/api/search?isbn=${isbn}&format=json` } 
        ]
    },
    state: { user: null, collection: [] },
    supabase: null,

    init: function() {
        this.supabase = window.supabase.createClient(this.config.supabaseUrl, this.config.supabaseKey);
        this.checkSession();
    },

    checkSession: async function() {
        const { data } = await this.supabase.auth.getSession();
        if (data.session) {
            this.state.user = data.session.user;
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            this.loadCollection();
        }
    },

    doLogin: async function() {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-password').value;
        const { error } = await this.supabase.auth.signInWithPassword({ email, password: pass });
        if (error) document.getElementById('login-msg').textContent = "Erreur: " + error.message;
        else window.location.reload();
    },

    loadCollection: async function() {
        if (!this.state.user) return;
        const { data } = await this.supabase.from('collection').select('*').eq('user_id', this.state.user.id).order('dateAdded', { ascending: false });
        this.state.collection = data || [];
        const list = document.getElementById('list');
        list.innerHTML = '';
        this.state.collection.forEach(item => {
            list.innerHTML += `<li style="border-bottom:1px solid #eee; padding:10px;"><strong>${item.title}</strong> - ${item.author || ''}</li>`;
        });
    },

    addItem: async function() {
        const title = document.getElementById('item-title').value;
        if (!title) return alert("Titre requis");
        await this.supabase.from('collection').insert([{
            title, author: document.getElementById('item-author').value,
            year: document.getElementById('item-year').value,
            category: document.getElementById('category').value,
            isbn: document.getElementById('isbn').value,
            dateAdded: new Date().toISOString(),
            user_id: this.state.user.id
        }]);
        alert("Ajouté !");
        this.loadCollection();
    },

    // --- MOTEUR DE RECHERCHE MULTI-SOURCES ---
    searchISBN: async function() {
        const isbn = document.getElementById('isbn').value.replace(/[^0-9X]/g, '').toUpperCase();
        const msg = document.getElementById('search-msg');
        const log = document.getElementById('source-log');
        
        if (!isbn) return;

        msg.textContent = "Recherche en cours...";
        msg.className = "status-msg info-msg";
        log.textContent = "";

        // On essaie chaque source l'une après l'autre
        for (const api of this.config.apis) {
            try {
                log.textContent = `Tentative avec ${api.name}...`;
                console.log(`Appel ${api.name}:`, api.url(isbn));

                const res = await fetch(api.url(isbn));
                
                // Si 429, on passe immédiatement à la suivante sans erreur bloquante
                if (res.status === 429) {
                    console.warn(`${api.name} bloqué (429). Passage à la suite...`);
                    continue; 
                }
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                let book = null;

                // Parsing spécifique selon l'API
                if (api.name === "Google Books") {
                    if (data.totalItems > 0) {
                        const info = data.items[0].volumeInfo;
                        book = {
                            title: info.title,
                            author: (info.authors || []).join(', '),
                            year: info.publishedDate ? info.publishedDate.substring(0,4) : ''
                        };
                    }
                } else if (api.name === "OpenLibrary") {
                    if (data.title) {
                        book = {
                            title: data.title,
                            author: data.authors ? (data.authors[0].name || data.authors[0]) : '',
                            year: data.first_publish_date ? data.first_publish_date.substring(0,4) : ''
                        };
                    }
                } else if (api.name === "BnF (France)") {
                    // La BnF renvoie souvent un tableau ou un objet complexe
                    if (data.document && data.document.length > 0) {
                        const doc = data.document[0];
                        book = {
                            title: doc.title || doc.zoneTitle,
                            author: doc.author || doc.zoneAuthor,
                            year: doc.datePublication ? doc.datePublication.substring(0,4) : ''
                        };
                    }
                }

                if (book && book.title) {
                    // SUCCÈS !
                    msg.textContent = `Trouvé via ${api.name} !`;
                    msg.className = "status-msg success-msg";
                    log.textContent = "";
                    
                    document.getElementById('item-title').value = book.title;
                    document.getElementById('item-author').value = book.author;
                    document.getElementById('item-year').value = book.year;
                    return; // On arrête la boucle
                }

            } catch (e) {
                console.warn(`Erreur ${api.name}:`, e);
                // On continue à la prochaine API
            }
        }

        // Si on arrive ici, aucune API n'a fonctionné
        msg.textContent = "Aucun résultat trouvé sur aucune des sources.";
        msg.className = "status-msg error-msg";
        log.textContent = "Google, OpenLibrary et BnF ont été interrogés sans succès.";
    }
};

App.init();
</script>
</body>
</html>
